name: backend

on:
  push:
    branches: [main]
    paths: [backend/**]
  pull_request:
    branches: [main]
    paths: [backend/**]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Unit tests (surefire) + Testcontainers integration tests (failsafe: *IT).
      - name: Build and test
        run: mvn -B verify
      - name: Docker build check
        run: docker build -t quradar-backend:ci .
