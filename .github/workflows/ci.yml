name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Unit tests (surefire) + Testcontainers integration tests (failsafe: *IT)
      # run here; Docker is available on ubuntu-latest runners.
      - name: Build and test
        run: mvn -B verify
      - name: Docker build check
        run: docker build -t quradar-backend:ci .
