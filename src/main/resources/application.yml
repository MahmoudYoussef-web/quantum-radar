spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/quradar}
    username: ${SPRING_DATASOURCE_USERNAME:quradar}
    password: ${SPRING_DATASOURCE_PASSWORD:quradar}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

quradar:
  demo:
    enabled: true
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-that-is-at-least-32-bytes-long!}
    access-minutes: 15
    refresh-days: 7
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
