spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/quradar}
    username: ${SPRING_DATASOURCE_USERNAME:quradar}
    password: ${SPRING_DATASOURCE_PASSWORD:quradar}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

quradar:
  demo:
    enabled: true
